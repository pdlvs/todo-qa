<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Lista de Tarefas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="task-container">
    <h2>Tarefas</h2>
    <form id="taskForm">
      <input type="text" id="newTask" placeholder="Digite uma tarefa" required>
      <button type="submit">Adicionar</button>
    </form>
    <ul id="taskList"></ul>
    <button id="logout">Sair</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
